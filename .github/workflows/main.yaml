name: CI/CD for Flask App (Without Docker Compose)

on:
  push:
    branches:
      - main  # Trigger pipeline on push to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-attendance-app .
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-attendance-app

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_KEY }}
          script: |
            # 1. Create Docker Network
            docker network create app_network || true

            # 2. MySQL Container service check and start
            if [ ! "$(docker ps -q -f name=mysql-db)" ]; then
                docker stop mysql-db || true
                docker rm mysql-db || true
                docker run -d \
                  --name mysql-db \
                  --network app_network \
                  -e MYSQL_ROOT_PASSWORD="${{ secrets.DB_PASSWORD }}" \
                  -e MYSQL_DATABASE="${{ secrets.DB_NAME }}" \
                  -p 3306:3306 \
                  mysql:latest
                
                echo "Waiting for MySQL to initialize..."
                sleep 20
            fi

            # 3. pull new image
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            docker pull ${{ secrets.DOCKER_USERNAME }}/flask-attendance-app:latest

            # 4. update old container
            docker stop flask-app || true
            docker rm flask-app || true

            docker run -d \
              --name flask-app \
              --network app_network \
              -p 5000:5000 \
              -e DB_HOST=mysql-db \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              ${{ secrets.DOCKER_USERNAME }}/flask-attendance-app:latest

            # 5. System Cleanup
            docker image prune -f